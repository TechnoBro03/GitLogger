[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "gitlogger-cli"
version = "0.0.2"
authors = [
  { name="TechnoBro03"},
]
description = "A CLI for generating public contribution history from private Git repositories."
readme = "README.md"

requires-python = ">=3.10"

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/TechnoBro03/Eventic"
Issues = "https://github.com/TechnoBro03/Eventic/issues"

[project.scripts]
gitlogger = "gitlogger_cli.cli:main"

[project.optional-dependencies]
test = [
  "mypy"
]